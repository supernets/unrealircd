oper cancer  { class local;   mask { ip {{ svc_ip }}; } maxlogins    1; modes BdD; operclass cancer;  password "{{ oper_passwords.cancer }}"; require-modes z; vhost RETTE; }
oper phalanx { class clients; mask {{ svc_ip }};        maxlogins 5000; modes BdD; operclass phalanx; password "{{ oper_passwords.phalanx }}";                  vhost R;     }

