{% for h in groups['leaves'] | sort %}
link {{ hostvars[h].server_name }}.supernets.org {
	incoming { mask {{ hostvars[h].ip }}; }
	outgoing {
		bind-ip *;
		hostname {{ hostvars[h].ip }};
		port {{ link_port }};
		options { tls; }
	}
	password "{{ hostvars[h].spkifp.stdout }}" { spkifp; };
	class servers;
}
{% if not loop.last %}

{% endif %}
{% endfor %}
