include "links.conf";
include "modules.conf";
include "snomasks.conf";

// GeoIP lookups happen on the leaves, the hub only passes the data on (geoip_base stays loaded for that)
blacklist-module "geoip_mmdb";

admin { ""; }

me { name "irc.supernets.org"; info "SuperNETs IRC Network"; sid 001; }

class servers { pingfreq 300; maxclients 20; sendq 5M; connfreq 30; }

listen { ip *;         port {{ link_port }}; options { serversonly; tls; } } # Links
listen { ip 127.0.0.1; port {{ anope_port }}; options { serversonly;      } } # Anope

link services.supernets.org {
	incoming { mask 127.0.0.1; port {{ anope_port }}; }
	password "{{ services_password }}";
	class servers;
}

log { source { error; fatal; warn; } destination { file "ircd.log"   { maxsize 5M;                          } } }
log { source { all; !debug;        } destination { channel "#services" { json-message-tag yes; oper-only yes; } } }

except ban { mask *@127.0.0.1; }

ulines { services.supernets.org; }

set {
	gline-address "enterthevoid@supernets.org";
	kline-address "enterthevoid@supernets.org";
	network-name "SuperNETs";
	default-server "irc.supernets.org";
	services-server "services.supernets.org";
	sasl-server "services.supernets.org";
	help-channel "#superbowl";
	cloak-method ip;
	cloak-keys {
		"{{ cloak_keys[0] }}";
		"{{ cloak_keys[1] }}";
		"{{ cloak_keys[2] }}";
	}
}